[project]
name = "doctrace-ai-service"
version = "0.1.0"
description = "DocTrace AI Microservice — Python + FastAPI inference service"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "psutil>=5.9.0",
    "transformers>=4.38.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "qdrant-client>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
