services:
  postgres:
    image: postgres:16-alpine
    container_name: doctrace-postgres
    restart: always
    environment:
      POSTGRES_DB: doctrace_prod
      POSTGRES_USER: doctrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctrace -d doctrace_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: doctrace-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: doctrace-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - EMBEDDING_DEVICE=cpu
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=invoice_page_embeddings_v1
      - VECTOR_STORE_BACKEND=qdrant
      - SIMILARITY_THRESHOLD=0.955
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
    depends_on:
      - qdrant

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctrace-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=doctrace_prod
      - DB_USERNAME=doctrace
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - AI_SERVICE_URL=http://ai-service:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      - UPLOAD_DIR=storage/uploads
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doctrace-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  qdrant_storage:
  postgres_data:
