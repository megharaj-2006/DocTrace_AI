version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: doctrace-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: doctrace-ai-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - EMBEDDING_DEVICE=cpu
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=invoice_page_embeddings_v1
      - SIMILARITY_THRESHOLD=0.955
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
