# ==============================================================================
# DocTrace AI Backend — Main Configuration
# ==============================================================================
# Profile-specific overrides are in application-{profile}.yml
# Activate with: --spring.profiles.active=dev|test|prod

spring:
  application:
    name: doctrace-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  # ── Jackson ──────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null

  # ── Servlet / Upload ─────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

# ── Server ─────────────────────────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

# ── OpenAPI / Swagger ──────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ── Application-specific Configuration ─────────────────────────────────────────
doctrace:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_use_a_64_char_minimum_secret_key_here_abc123}
    expiration-ms: 86400000   # 24 hours

  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 30000
    read-timeout-ms: 300000
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-secret-key-12345}


  storage:
    upload-dir: ${UPLOAD_DIR:storage/uploads}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    com.doctrace.backend: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
